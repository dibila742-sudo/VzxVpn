name: build
on:
  push:
    paths: [build.py]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python build.py
      - run: |
          git config user.name github-actions
          git config user.email actions@github.com
          git add VzxVpn.txt
          git commit -m update || exit 0
          git push
